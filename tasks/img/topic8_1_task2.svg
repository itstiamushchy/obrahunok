<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
<text x="10" y="25" font-family="serif" font-size="14">а) через 1 точку — ∞ прямих</text>
<circle cx="80" cy="80" r="4" fill="black"/><text x="62" y="72" font-family="serif" font-size="14">A</text>
<line x1="30" y1="80" x2="130" y2="80" stroke="black" stroke-width="1.5"/>
<line x1="40" y1="50" x2="120" y2="110" stroke="black" stroke-width="1.5"/>
<line x1="80" y1="40" x2="80" y2="120" stroke="black" stroke-width="1.5"/>
<text x="160" y="25" font-family="serif" font-size="14">б) через 2 точки — 1 пряма</text>
<circle cx="200" cy="80" r="4" fill="black"/><text x="193" y="72" font-family="serif" font-size="14">A</text>
<circle cx="300" cy="80" r="4" fill="black"/><text x="293" y="72" font-family="serif" font-size="14">B</text>
<line x1="170" y1="80" x2="330" y2="80" stroke="black" stroke-width="2"/>
<text x="10" y="170" font-family="serif" font-size="14">в) через 3 точки (не на одній прямій)</text>
<circle cx="160" cy="210" r="4" fill="black"/><text x="148" y="205" font-family="serif" font-size="14">A</text>
<circle cx="300" cy="210" r="4" fill="black"/><text x="305" y="205" font-family="serif" font-size="14">B</text>
<circle cx="230" cy="270" r="4" fill="black"/><text x="235" y="285" font-family="serif" font-size="14">C</text>
<line x1="160" y1="210" x2="300" y2="210" stroke="black" stroke-width="1.5" stroke-dasharray="6,3"/>
<line x1="160" y1="210" x2="230" y2="270" stroke="black" stroke-width="1.5" stroke-dasharray="6,3"/>
<line x1="300" y1="210" x2="230" y2="270" stroke="black" stroke-width="1.5" stroke-dasharray="6,3"/>
</svg>
