<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
<line x1="50" y1="250" x2="380" y2="250" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<line x1="50" y1="250" x2="50" y2="20" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="black"/></marker></defs>
<text x="385" y="255" font-family="serif" font-size="14">x</text>
<text x="40" y="15" font-family="serif" font-size="14">y</text>
<!-- grid -->
<g stroke="#ccc" stroke-width="0.5">
<line x1="50" y1="50" x2="380" y2="50"/><line x1="50" y1="100" x2="380" y2="100"/>
<line x1="50" y1="150" x2="380" y2="150"/><line x1="50" y1="200" x2="380" y2="200"/>
<line x1="100" y1="20" x2="100" y2="250"/><line x1="150" y1="20" x2="150" y2="250"/>
<line x1="200" y1="20" x2="200" y2="250"/><line x1="250" y1="20" x2="250" y2="250"/>
<line x1="300" y1="20" x2="300" y2="250"/><line x1="350" y1="20" x2="350" y2="250"/>
</g>
<!-- points: 1 unit = 50px, origin at (50,250) -->
<circle cx="100" cy="250" r="5" fill="black"/><text x="90" y="272" font-family="serif" font-size="14">A(1,0)</text>
<circle cx="200" cy="250" r="5" fill="black"/><text x="185" y="272" font-family="serif" font-size="14">B(3,0)</text>
<circle cx="150" cy="150" r="5" fill="black"/><text x="155" y="145" font-family="serif" font-size="14">C(2,2)</text>
<line x1="100" y1="250" x2="200" y2="250" stroke="black" stroke-width="2"/>
<line x1="100" y1="250" x2="150" y2="150" stroke="black" stroke-width="1.5" stroke-dasharray="6,3"/>
<line x1="200" y1="250" x2="150" y2="150" stroke="black" stroke-width="1.5" stroke-dasharray="6,3"/>
<!-- scale -->
<text x="95" y="245" font-family="serif" font-size="11">1</text>
<text x="195" y="245" font-family="serif" font-size="11">3</text>
<text x="33" y="155" font-family="serif" font-size="11">2</text>
</svg>
