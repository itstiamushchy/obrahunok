<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
<text x="10" y="20" font-family="serif" font-size="13">Гострокутний</text>
<polygon points="20,120 140,120 80,40" fill="none" stroke="black" stroke-width="2"/>
<text x="55" y="140" font-family="serif" font-size="11">всі &lt; 90°</text>
<text x="160" y="20" font-family="serif" font-size="13">Прямокутний</text>
<polygon points="160,120 300,120 300,40" fill="none" stroke="black" stroke-width="2"/>
<rect x="288" y="108" width="10" height="10" fill="none" stroke="black" stroke-width="1"/>
<text x="210" y="140" font-family="serif" font-size="11">один = 90°</text>
<text x="310" y="20" font-family="serif" font-size="13">Тупокутний</text>
<polygon points="310,120 395,120 395,40" fill="none" stroke="black" stroke-width="2"/>
<polygon points="310,120 395,120 330,40" fill="none" stroke="black" stroke-width="2"/>
<text x="330" y="140" font-family="serif" font-size="11">один > 90°</text>
</svg>
